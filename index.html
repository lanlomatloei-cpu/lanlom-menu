<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลานลม ชมเลย</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- โหลด Flatpickr สำหรับปฏิทินภาษาไทย -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #f7f9fa; color: #333333; padding: 16px 14px 28px; }
    .header { text-align: center; padding: 14px 10px 18px; background: #ffffff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 18px; }
    .header h2 { color: #1b4d3e; font-size: 20px; margin-bottom: 4px; }
    .header p { color: #666666; font-size: 13px; }
    .section-title { font-size: 14px; font-weight: 600; color: #27493a; margin: 16px 0 10px 4px; display: flex; align-items: center; gap: 6px; }
    .section-title::before { content: ""; display: inline-block; width: 4px; height: 14px; background: #2e7d32; border-radius: 2px; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .menu-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 8px; background: #ffffff; border-radius: 12px; color: #2c3e50; font-size: 13px; font-weight: 500; border: 1px solid #edf0f2; box-shadow: 0 2px 6px rgba(0,0,0,0.03); cursor: pointer; text-align: center; }
    .menu-card:active { transform: scale(0.97); background: #eef7f0; }
    .menu-card .icon { font-size: 24px; margin-bottom: 6px; }
    .footer { text-align: center; margin-top: 26px; font-size: 12px; color: #8c9ba5; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f7f9fa; z-index: 9999; overflow-y: auto; padding: 16px 12px 30px; }
    .modal-overlay.active { display: flex; flex-direction: column; }
    .btn-back-modal { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; margin-left: auto; color: #000000; font-size: 14.5px; font-weight: 700; padding: 9px 18px; background-color: #c03ca8; border-radius: 25px; border: none; box-shadow: 0 4px 12px rgba(192, 60, 168, 0.35); cursor: pointer; }
    .form-card { background: #ffffff; padding: 22px 18px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); width: 100%; max-width: 480px; margin: 0 auto; }
    .form-card h3 { color: #1b4d3e; margin-bottom: 6px; text-align: center; font-size: 18px; }
    .form-card .subtitle { color: #666; font-size: 12px; text-align: center; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13.5px; color: #2c3e50; }
    input, select, textarea { width: 100%; padding: 11px 12px; font-size: 15px; border: 1.5px solid #dcdfe6; border-radius: 8px; background-color: #fff; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #1b4d3e; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    .btn-submit { width: 100%; background-color: #1b4d3e; color: #ffffff; border: none; padding: 12px; font-size: 15px; font-weight: 500; border-radius: 8px; cursor: pointer; margin-top: 6px; }
    .btn-submit:disabled { background-color: #95a5a6; }
    .status-msg { margin-top: 14px; text-align: left; font-size: 13.5px; font-weight: 500; white-space: pre-line; background: #e8f5e9; padding: 10px; border-radius: 8px; color: #1b5e20; display: none; }
    .date-status-badge { text-align: center; font-size: 12.5px; color: #2c3e50; font-weight: 500; margin: 14px 0 12px; }
    .room-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; margin-bottom: 8px; border-radius: 6px; font-size: 13.5px; }
    .room-row.available { background-color: #e8f5e9; border: 1px solid #c8e6c9; color: #1b5e20; }
    .room-row.booked { background-color: #ffebee; border: 1px solid #ffcdd2; color: #b71c1c; }
    .room-title-area { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .btn-action-book { background-color: #1b4d3e; color: #ffffff; border: none; padding: 5px 12px; border-radius: 4px; font-size: 12.5px; cursor: pointer; }
    .image-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 10000; overflow: hidden; }
    .image-viewer.active { display: block; }
    .btn-back-image { position: fixed !important; top: 16px !important; right: 16px !important; z-index: 999999 !important; display: inline-flex; align-items: center; gap: 8px; color: #000; font-size: 14.5px; font-weight: 700; padding: 9px 18px; background-color: #c03ca8; border-radius: 25px; border: none; cursor: pointer; }
    .image-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #viewerImage { max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🍃 ลานลม ชมเลย</h2>
    <p>บริการและเมนูอาหารออนไลน์</p>
  </div>

  <div class="section-title">บริการและการจอง</div>
  <div class="menu-grid">
    <div onclick="openModal('modalBooking')" class="menu-card"><span class="icon">📝</span>จองโต๊ะ / ห้อง VIP</div>
    <div onclick="openModal('modalRoom')" class="menu-card"><span class="icon">🔍</span>เช็กห้องว่าง VIP</div>
    <div onclick="openModal('modalFood')" class="menu-card"><span class="icon">🍲</span>สั่งอาหารล่วงหน้า</div>
    <div onclick="openModal('modalCancel')" class="menu-card"><span class="icon">🗑️</span>ยกเลิกการจอง</div>
  </div>

  <div class="footer">ร้านเปิดให้บริการทุกวัน 17:00 - 24:00 น.</div>

  <!-- 1. Modal ฟอร์มจองโต๊ะ -->
  <div id="modalBooking" class="modal-overlay">
    <button class="btn-back-modal" onclick="closeModal('modalBooking')">✕ ย้อนกลับไปเมนูหลัก</button>
    <div class="form-card">
      <h3>📝 จองโต๊ะ / ห้อง VIP</h3>
      <div class="subtitle">กรอกรายละเอียดเพื่อทำการจอง</div>
      <form onsubmit="submitBooking(event)">
        <div class="form-group">
          <label>📅 วันที่ต้องการจอง</label>
          <input type="text" id="bookDate" required>
        </div>
        <div class="form-group">
          <label>🥂 โต๊ะ / ห้องที่ต้องการ</label>
          <select id="bookTable" required>
            <option value="">-- กรุณาเลือก --</option>
            <option value="ด้านนอก">โต๊ะด้านนอกทั่วไป</option>
            <option value="V1">ห้อง VIP: V1</option>
            <option value="V2">ห้อง VIP: V2</option>
            <option value="V3">ห้อง VIP: V3</option>
            <option value="V4">ห้อง VIP: V4</option>
            <option value="V5">ห้อง VIP: V5</option>
          </select>
        </div>
        <div class="form-group">
          <label>👤 ชื่อผู้จอง</label>
          <input type="text" id="bookName" placeholder="ระบุชื่อ-นามสกุล หรือชื่อเล่น" required>
        </div>
        <div class="row">
          <div class="form-group">
            <label>👥 จำนวนคน</label>
            <input type="number" id="bookPax" placeholder="เช่น 4" min="1" required>
          </div>
          <div class="form-group">
            <label>⏰ เวลาเข้า</label>
            <select id="bookTime" required>
              <option value="17:00">17:00</option>
              <option value="17:30">17:30</option>
              <option value="18:00" selected>18:00</option>
              <option value="18:30">18:30</option>
              <option value="19:00">19:00</option>
              <option value="19:30">19:30</option>
              <option value="20:00">20:00</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>📞 เบอร์ติดต่อ</label>
          <input type="tel" id="bookPhone" placeholder="เช่น 0812345678" required>
        </div>
        <button type="submit" id="btnBookSubmit" class="btn-submit">ยืนยันการจอง</button>
        <div id="bookStatus" class="status-msg"></div>
      </form>
    </div>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaqvpVM5EB3VYZtj88IMpMxcvNvfbDIFSyfIYzwfz0lxJlS2qG5xPjo6sYMDO3d3Ow/exec";
    var psid = new URLSearchParams(window.location.search).get('psid') || '';

    document.addEventListener("DOMContentLoaded", function() {
      var fpConfig = { locale: "th", dateFormat: "Y-m-d", altInput: true, altFormat: "j F Y", defaultDate: "today" };
      flatpickr("#bookDate", fpConfig);
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // ฟังก์ชันส่งฟอร์มจองและแสดงผลตอบกลับ
    function submitBooking(e) {
      e.preventDefault();
      var btn = document.getElementById('btnBookSubmit');
      var status = document.getElementById('bookStatus');
      btn.disabled = true; 
      btn.innerText = "กำลังบันทึกข้อมูล...";
      status.style.display = "none";
      
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "web_booking",
          bookDate: document.getElementById('bookDate').value,
          table: document.getElementById('bookTable').value,
          name: document.getElementById('bookName').value,
          pax: document.getElementById('bookPax').value,
          time: document.getElementById('bookTime').value,
          phone: document.getElementById('bookPhone').value,
          psid: psid
        })
      })
      .then(r => r.json())
      .then(res => {
        status.style.display = "block";
        if (res.success) {
          status.style.background = "#e8f5e9";
          status.style.color = "#1b5e20";
          status.innerText = res.message; // แสดงข้อความสำเร็จแบบในภาพ[cite: 3]
          e.target.reset();
          btn.innerText = "จองสำเร็จแล้ว";
        } else {
          status.style.background = "#ffebee";
          status.style.color = "#b71c1c";
          status.innerText = "⚠️ " + res.message;
          btn.disabled = false; 
          btn.innerText = "ยืนยันการจอง";
        }
      })
      .catch(() => {
        status.style.display = "block";
        status.style.background = "#ffebee";
        status.style.color = "#b71c1c";
        status.innerText = "⚠️ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้";
        btn.disabled = false; 
        btn.innerText = "ยืนยันการจอง";
      });
    }
  </script>
</body>
</html>
